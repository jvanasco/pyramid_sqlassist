[metadata]
name = pyramid_sqlassist
version = attr: pyramid_sqlassist.__VERSION__
description = Efficiently manage multiple SqlAlchemy connections for Pyramid
long_description = file: README.md
long_description_content_type = text/markdown
author = Jonathan Vanasco
author_email = jvanasco@2xlp.com
url = https://github.com/jvanasco/pyramid_sqlassist
license = MIT
keywords = web, Pyramid, SQLAlchemy
classifiers =
    Intended Audience :: Developers
    Framework :: Pyramid
    Programming Language :: Python :: 3
    Programming Language :: Python :: 3.7
    Programming Language :: Python :: 3.8
    Programming Language :: Python :: 3.9
    Programming Language :: Python :: 3.10
    Programming Language :: Python :: 3.11
    Programming Language :: Python :: 3.12
    Programming Language :: Python :: 3.13
    Programming Language :: Python :: 3.14
    Programming Language :: Python :: 3.15

[options]
python_requires = >=3.7
package_dir =
    = src
packages = find:
zip_safe = False
install_requires =
    SQLAlchemy>=2.0
    pyramid
    typing_extensions
    setuptools<82; python_version < "3.10"

[options.packages.find]
where = src

[options.package_data]
pyramid_sqlassist =
    py.typed
    debugtoolbar/panels/templates/*

[options.extras_require]
testing =
    coverage
    mypy
    pytest
    pyramid_mako
    pyramid_debugtoolbar
    pyramid_tm
    transaction
    webtest
    zope.sqlalchemy>=1.6

[tox:tox]
min_version = 4.0
env_list = py{37,38,39,310,311,312,313,314,315}

[testenv]
package = sdist
extras = testing
set_env =
    COVERAGE_FILE = {envtmpdir}/.coverage
commands =
    python --version
    python -m coverage run --source=pyramid_sqlassist -m pytest {posargs}
    python -m coverage report
    python -m coverage html -d {tox_root}/htmlcov/{env_name}

[flake8]
application_import_names = pyramid_sqlassist
import_order_style = appnexus
exclude = .eggs, build
per-file-ignores =
    src/pyramid_sqlassist/interface.py: E501
    src/pyramid_sqlassist/objects.py: E501
    src/pyramid_sqlassist/debugtoolbar/panels/sqlassist.py: E501
    tests/*: E501
