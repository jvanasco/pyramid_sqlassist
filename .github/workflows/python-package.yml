name: Python package

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.7", "3.8", "3.9", "3.10", "3.11", "3.12", "3.13", "3.14", "3.15"]
        include:
          - python-version: "3.7"
            image: python:3.7.17-bullseye

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        if: ${{ !matrix.image }}
        with:
          python-version: ${{ matrix.python-version }}
      - name: Test the built package
        env:
          PYTHON_VERSION: ${{ matrix.python-version }}
          PYTHON_IMAGE: ${{ matrix.image }}
        run: |
          export TOX_ENV="py${PYTHON_VERSION//./}"
          test_command='python -m pip install "tox>=4,<5" && python -m tox run -e "$TOX_ENV"'
          if [[ -n "$PYTHON_IMAGE" ]]; then
            docker run --rm --env TOX_ENV --volume "$PWD:/workspace" \
              --workdir /workspace "$PYTHON_IMAGE" bash -ec "$test_command"
          else
            bash -ec "$test_command"
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: coverage-py${{ matrix.python-version }}
          path: htmlcov/
          if-no-files-found: error
